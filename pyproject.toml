[project]
name = "withings-mcp"
version = "2.0.0"
description = "MCP server for querying Withings health data (measurements, activity, sleep, heart)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "withings", "health", "model-context-protocol"]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
withings-mcp = "withings_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/withings_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/withings_mcp" = "withings_mcp"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
